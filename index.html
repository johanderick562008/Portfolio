    <!--preload-->
    <script>
      // Before first paint: pick the theme (saved choice, else the OS) and opt into motion.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var t = null;
        try {
          t = localStorage.getItem("jd-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p class="noscript">The games and charts need JavaScript; everything else on this page works without it.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
